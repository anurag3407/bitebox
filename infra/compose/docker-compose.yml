version: "3.8"

services:
  nginx:
    image: nginx:alpine
    container_name: startup-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certs:/etc/ssl/certs:ro
    depends_on:
      - web
    networks:
      - startup-net

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    container_name: startup-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      MAPBOX_SECRET_TOKEN: ${MAPBOX_SECRET_TOKEN}
      NEXT_PUBLIC_MAPBOX_PUBLIC_TOKEN: ${NEXT_PUBLIC_MAPBOX_PUBLIC_TOKEN}
      FAST2SMS_API_KEY: ${FAST2SMS_API_KEY}
      BREVO_API_KEY: ${BREVO_API_KEY}
      APP_URL: ${APP_URL:-https://zomatofresh.local}
    networks:
      - startup-net

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    container_name: startup-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      FAST2SMS_API_KEY: ${FAST2SMS_API_KEY}
      BREVO_API_KEY: ${BREVO_API_KEY}
    networks:
      - startup-net

networks:
  startup-net:
    driver: bridge

volumes:
  certs:
