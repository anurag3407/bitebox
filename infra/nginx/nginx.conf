# Edge proxy: TLS termination, HTTP→HTTPS, coarse per-IP limits, SSE passthrough.
# Fine-grained per-user limits are enforced in the app (Upstash).
events {
    worker_connections 4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;

    # Coarse abuse guard per client IP (app-level limits are stricter per user)
    limit_req_zone $binary_remote_addr zone=api:20m rate=30r/s;
    limit_req_status 429;

    log_format main_json escape=json '{"ts":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
                                     '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
                                     '"rt":$request_time,"urt":"$upstream_response_time","rid":"$request_id"}';
    access_log /var/log/nginx/access.log main_json;

    upstream nextjs_upstream {
        server web:3000;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/letsencrypt/live/app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;

        client_max_body_size 3m; # menu photos are capped at 2 MB by the app

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (never append) so clients cannot inject a fake client IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";

        location /_next/static/ {
            proxy_pass http://nextjs_upstream;
            expires 365d;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Live order tracking (Server-Sent Events): no buffering, long reads
        location ~ ^/api/v1/orders/[^/]+/live$ {
            proxy_pass http://nextjs_upstream;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 15m;
        }

        # Razorpay retries on non-2xx; keep it out of the per-IP limiter
        location = /api/v1/webhooks/razorpay {
            proxy_pass http://nextjs_upstream;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://nextjs_upstream;
            proxy_read_timeout 30s;
        }

        location / {
            proxy_pass http://nextjs_upstream;
            proxy_read_timeout 60s;
        }
    }
}
